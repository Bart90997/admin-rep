<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Li.Fe. Radio - Pannello Admin</title>
<style>
:root{--bg:#0a1628;--panel:#101f38;--panel2:#16294a;--line:#22406e;--txt:#e8f0fb;--muted:#8fa9cc;--blue:#2b7fff;--ok:#22c55e;--err:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#0a1628,#12294a);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
.conn{font-size:12px;padding:4px 10px;border-radius:20px;background:#1b2f52;color:var(--muted)}
.conn.ok{background:rgba(34,197,94,.15);color:#7ee2a8}
.conn.err{background:rgba(239,68,68,.15);color:#ff9b9b}
#dirtyBadge{display:none;background:rgba(245,158,11,.2);color:#fcd34d;font-size:12px;padding:4px 10px;border-radius:20px}
.spacer{flex:1}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.danger{background:var(--err)}
.btn.small{padding:5px 9px;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=password],textarea{width:100%;background:#0d1c33;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
textarea{resize:vertical}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#0d1c33;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tabpane{display:none}
.tabpane.active{display:block}
.group{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.group h3{margin:0 0 10px;font-size:13px;color:#9fc2f0;text-transform:uppercase;letter-spacing:.5px}
.row{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:start;margin-bottom:8px}
.row label{margin:0;padding-top:8px;color:var(--txt);font-size:12px}
.imgcard{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.imgcard img{width:70px;height:50px;object-fit:cover;border-radius:6px;background:#0a1628}
.imgcard .noimg{width:70px;height:50px;display:flex;align-items:center;justify-content:center;background:#0a1628;border-radius:6px;color:var(--muted);font-size:11px}
.imginfo{flex:1;min-width:0}
.imginfo b{display:block;font-size:13px}
.imginfo span{display:block;font-size:11px;color:var(--muted);word-break:break-all}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.slot b{color:#9fc2f0;width:60px}
.slot-title{flex:1;font-size:13px}
.slot-empty{flex:1;color:var(--muted);font-size:13px;font-style:italic}
.newsrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.newsrow .nt{flex:1;font-size:13px;min-width:0}
.newsrow .nt b{color:#9fc2f0;margin-right:6px;font-size:11px}
.newsrow .na{display:flex;gap:6px;flex:none}
.archive-info{color:var(--muted);font-size:12px;margin-bottom:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#12294a;border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:100;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--ok)}
.toast.err{border-color:var(--err)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
<h1>Li.Fe. Radio - Admin</h1>
<span id="connState" class="conn">Non connesso</span>
<span id="dirtyBadge">Modifiche non salvate</span>
<span class="spacer"></span>
<button id="btnReload" class="btn ghost">Ricarica</button>
<button id="btnSave" class="btn">Salva su GitHub</button>
</header>
<main>
<div class="card">
<h2>Connessione al repository GitHub</h2>
<div class="grid">
<div><label>Proprietario (owner)</label><input type="text" id="ghOwner" placeholder="es. liferadio"></div>
<div><label>Repository</label><input type="text" id="ghRepo" placeholder="es. sito-liferadio"></div>
<div><label>Branch</label><input type="text" id="ghBranch" placeholder="main" value="main"></div>
<div><label>Token GitHub (PAT)</label><input type="password" id="ghToken" placeholder="github_pat_..."></div>
</div>
<div style="margin-top:12px"><button id="btnConnect" class="btn">Connetti e carica</button></div>
<p class="hint">Il token resta solo nel tuo browser. Usa un fine-grained token con permesso "Contents: Read and write" su questo repository.</p>
</div>
<div class="tabs">
<div class="tab active" data-pane="fields">Contenuti</div>
<div class="tab" data-pane="images">Immagini</div>
<div class="tab" data-pane="featured">In evidenza</div>
<div class="tab" data-pane="archive">Archivio notizie</div>
</div>
<div id="pane-fields" class="tabpane active"><div id="fieldsWrap"></div></div>
<div id="pane-images" class="tabpane"><div id="imagesWrap"></div></div>
<div id="pane-featured" class="tabpane"><div id="featuredWrap"></div></div>
<div id="pane-archive" class="tabpane">
<div class="card">
<input type="text" id="archiveSearch" placeholder="Cerca una notizia...">
<div id="archiveWrap" style="margin-top:12px"></div>
</div>
</div>
</main>
<div id="toast" class="toast"></div>
<script src="admin-app.js"></script>
</body>
</html>

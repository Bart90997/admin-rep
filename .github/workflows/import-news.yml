name: Import notizie All Music Italia

# Import automatico delle notizie da allmusicitalia.it (senza PHP).
# Gira sui server di GitHub, poi committa i JSON aggiornati nel repository.

on:
  schedule:
    # Ogni giorno alle 10:00 UTC = 12:00 (mezzogiorno) ora italiana
    - cron: '0 10 * * *'
  workflow_dispatch: {}   # permette anche l'avvio manuale dal sito GitHub

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import notizie
        env:
          MAX_NEW: '8'        # quante notizie nuove al massimo per ogni esecuzione
          CLEANUP_DAYS: '30'  # elimina le notizie piu' vecchie di 30 giorni (0 = disattiva)
        run: node scripts/import-news.js

      - name: Commit e push dei file aggiornati
        run: |
          git config user.name "Li.Fe. Radio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Import automatico notizie ($(date -u +%Y-%m-%d))"
            git push
          fi
